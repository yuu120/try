<!DOCTYPE html>
<html>
<head>
<title>4444</title>
  <style>
    body {
      background-color: lightblue;
    }
    .red-bg {
      background-color: red;
    }
    #ghost {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: auto;
    }
    button {
      padding: 10px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1 id="title">歡迎來到我的網站</h1>
  <button onclick="toggleEffect()" id="toggleBtn">哈哈</button>
  <!這裡的檔案路徑需要根據實際情況修改>
  <img id="ghost" src="image/XIXI.jpg" alt="鬼臉">
  
  <script>
    function toggleEffect() {
      let body = document.body;
      let button = document.getElementById("toggleBtn");
      let title = document.getElementById("title");

      if (body.classList.contains("red-bg")) {
        // 恢復原狀
        body.classList.remove("red-bg");
        button.textContent = "哈哈";
        title.textContent = "歡迎來到我的網站";
        document.getElementById("ghost").style.display = "none";
      } else {
        // 變紅色 + 變更標題和按鈕文字
        body.classList.add("red-bg");
        button.textContent = "不笑了";
        title.textContent = "笑什麼！不要笑！！！";

        // 10秒後顯示鬼臉
        setTimeout(function() {
          document.getElementById("ghost").style.display = "block";
        }, 3000);
      }
    }
  </script>
</body>
</html>
